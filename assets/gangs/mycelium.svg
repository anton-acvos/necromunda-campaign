<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img"
     aria-label="Mycelium Section: a cap over a hood, on a root network">
  <title>Mycelium Section</title>
  <!--
    House Delaque, grown in the dark. The cap is also a hood: the band of
    gills under it is a face you cannot see into, and the two lit slits are
    the only part of a Delaque anyone reports afterwards.

    The hyphae are drawn uneven on purpose. A root network that forks at
    equal angles reads as a diagram; this one reads as something that grew.

    Colours come from the gang's own: ink is the silhouette, spore is the
    #7d9683 the map already uses for this gang.

    Ink is fixed light rather than following prefers-color-scheme. The page
    is dark whatever the reader's machine thinks, and an <img> cannot inherit
    the page's colours — a media query here would hand a reader on a light
    desktop a dark logo on a dark card.
  -->
  <style>
    svg { --ink: #e8e0d4; --spore: #7d9683; --void: #05080a; }
  </style>

  <g fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round">

    <!-- the ring, broken where the stem passes through it -->
    <path d="M 95 101 A 52 52 0 1 0 25 101" stroke-width="4"/>
    <path d="M 25 101 A 52 52 0 0 0 38 110" stroke-width="4"/>
    <path d="M 95 101 A 52 52 0 0 1 82 110" stroke-width="4"/>

    <!-- cap: higher on the left, the way they grow towards a vent -->
    <path d="M 18 60
             C 18 32, 39 17, 60 17
             C 83 17, 103 33, 103 61
             C 92 69, 77 72, 60 72
             C 41 72, 27 68, 18 60 Z"
          fill="var(--ink)" stroke-width="2"/>

    <!-- the dark under the brim -->
    <path d="M 22 63
             C 33 69, 46 72, 60 72
             C 76 72, 90 69, 99 63
             L 97 70
             C 87 75, 74 78, 60 78
             C 45 78, 32 75, 23 70 Z"
          fill="var(--void)" stroke="none"/>

    <!-- gills, hanging at uneven lengths -->
    <g stroke="var(--spore)" stroke-width="1.4" opacity="0.5">
      <path d="M 29 68 L 30 75"/>
      <path d="M 37 71 L 38 77"/>
      <path d="M 45 73 L 45 78"/>
      <path d="M 75 73 L 75 78"/>
      <path d="M 83 71 L 84 77"/>
      <path d="M 91 68 L 90 74"/>
    </g>

    <!-- what looks back -->
    <g fill="var(--spore)" stroke="none">
      <path d="M 50 70 L 57 71 L 57 74 L 50 73 Z"/>
      <path d="M 63 71 L 70 70 L 70 73 L 63 74 Z"/>
    </g>

    <!-- stem, leaning the way the cap does not -->
    <path d="M 53 76
             C 52 85, 51 93, 52 101
             L 69 101
             C 68 93, 67 85, 67 76"
          fill="var(--ink)" stroke-width="2"/>

    <!-- hyphae: no two the same length, no two the same angle -->
    <g stroke="var(--ink)" stroke-width="2.4">
      <path d="M 54 101 C 46 104, 38 104, 29 108"/>
      <path d="M 38 105 C 35 109, 31 110, 26 114"/>
      <path d="M 58 102 C 54 107, 49 111, 46 117"/>
      <path d="M 62 102 C 63 108, 62 112, 64 118"/>
      <path d="M 66 101 C 73 104, 79 105, 86 110"/>
      <path d="M 78 107 C 82 110, 84 113, 85 117"/>
      <path d="M 69 100 C 78 100, 86 99, 95 101"/>
      <path d="M 51 100 C 43 99, 36 100, 30 99"/>
    </g>
    <g fill="var(--spore)" stroke="none">
      <circle cx="26" cy="114.5" r="1.9"/>
      <circle cx="64.4" cy="118" r="1.6"/>
      <circle cx="85.3" cy="117" r="2.1"/>
      <circle cx="29.6" cy="99" r="1.5"/>
    </g>
  </g>
</svg>
